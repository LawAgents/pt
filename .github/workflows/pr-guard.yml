name: Guarda de pull requests

# Why pull_request_target and not pull_request: this workflow is a gate, so its
# definition must come from the base branch. With pull_request, a PR could edit
# this very file and switch the check off. pull_request_target always runs the
# base-branch version. It is safe here because the job never checks out, builds
# or executes anything from the PR: it only asks the API for the list of changed
# file names, with a read-only token and no secrets. Keep it that way: do not
# add a checkout of the PR head to this workflow.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block edits to legislation files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          # Allowed to touch legislation: the repo owner and the weekly publisher.
          # Everyone may touch config/nomes-comuns.txt, README.md and docs/** (not matched below).
          shopt -s nocasematch
          if [[ "$AUTHOR" == "$REPO_OWNER" || "$ASSOCIATION" == "OWNER" || "$AUTHOR" == "github-actions[bot]" ]]; then
            echo "Autor autorizado ($AUTHOR): sem restrições."
            exit 0
          fi
          shopt -u nocasematch

          # Diploma folders (*.md) and the generated index files at the repo root.
          re='^(((codigos|leis|decretos-lei|portarias|leis-organicas|constituicao|outros|avisos|declaracoes|resolucoes-[^/]+|decretos[^/]*|despachos[^/]*)/.*\.md)|((nomes-comuns|indice|indice-[^/]*|revogados|COBERTURA|estatisticas)\.(md|html)))$'

          # previous_filename covers renames away from a protected path.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          blocked=$(printf '%s\n' "$files" | grep -E "$re" | sort -u || true)

          if [ -z "$blocked" ]; then
            echo "Nenhum ficheiro de legislação alterado."
            exit 0
          fi

          list=$(printf '%s\n' "$blocked" | sed -n '1,20p' | sed 's/^/- /')
          {
            echo "### Pull request recusado: ficheiros de legislação"
            echo
            echo "Os ficheiros de legislação não aceitam edições à mão. São gerados automaticamente a partir do Diário da República."
            echo
            echo "Ficheiros afetados (máximo 20 listados):"
            echo
            echo "$list"
            echo
            echo "Para corrigir um diploma, abra uma issue com o identificador do diploma e a ligação oficial do Diário da República."
            echo "Só são aceites pull requests para config/nomes-comuns.txt, README.md e docs/."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Ficheiros de legislação não aceitam pull requests::Este pull request altera ficheiros de legislação, que não aceitam edições à mão. Abra antes uma issue com o identificador do diploma e a ligação oficial do Diário da República. Só são aceites pull requests para config/nomes-comuns.txt, README.md e docs/."
          exit 1
